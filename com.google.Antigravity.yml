id: com.google.Antigravity
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: antigravity
finish-args:
  # Basic network and IPC access for the IDE and its agent
  - --share=network
  - --share=ipc
  # Standard display sockets for X11 and Wayland
  - --socket=x11
  - --socket=wayland
  # Bypass Flatpak's default session-bus symlink logic which is broken on non-systemd hosts (Guix/Alpine).
  # We handle the bus connection manually in the startup script.
  - --nosocket=session-bus
  # Required for hardware/power status discovery and some system-level integrations
  - --socket=system-bus
  # Essential for PipeWire/PulseAudio support to prevent wireplumber CPU spikes
  - --socket=pulseaudio
  # Required for full GPU acceleration, particularly for NVIDIA proprietary drivers
  - --device=all
  # Access to user files.
  - --filesystem=home
  # Allow the agent to interact with the host's Docker daemon
  - --filesystem=/var/run/docker.sock
  # Desktop integration for secrets management and GPG signing
  - --filesystem=xdg-run/keyring
  - --filesystem=xdg-run/gnupg
  # Permission to send desktop alerts
  - --talk-name=org.freedesktop.Notifications
  # Permission to access the secrets portal
  - --talk-name=org.freedesktop.secrets
  # Access to the desktop portals for file selection, etc.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.freedesktop.portal.Flatpak
  - --talk-name=org.freedesktop.Flatpak
  # Force GNOME branding for consistent UI behavior
  - --env=XDG_CURRENT_DESKTOP=GNOME
  # Standard SSL certificate locations for the agent to fetch external data
  - --env=SSL_CERT_DIR=/etc/ssl/certs
  - --env=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
  ## Guix-specific mounts (Optional/Ignored on standard distros)
  # Essential: All Guix tools and libraries reside here.
  - --filesystem=/gnu/store:ro
  # Essential: Profile management and state. Must be read-write for 'guix shell'.
  - --filesystem=/var/guix
  # Essential: Host system profile (for graphics drivers and system-wide modules).
  - --filesystem=/run/current-system:ro
  # Essential: Explicitly mount profiles to ensure symlinks resolve correctly inside the sandbox.
  - --filesystem=~/.guix-profile:ro
  - --filesystem=~/.config/guix:ro
  # Essential: Allow 'herd' and 'shepherd' commands to talk to the existing host process.
  - --filesystem=xdg-run/shepherd:ro
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/antigravity /app/bin /app/share/applications /app/share/icons/hicolor/scalable/apps /app/share/metainfo
      - perl -pi -e 's/eeijfnjmjelapkebgockoeaadonbchdd/ldpkpkgnnacjhjfkagclpmibpplpmmlf/g' resources/app/extensions/antigravity/bin/language_server_linux_x64
      - perl -pi -e 's/eeijfnjmjelapkebgockoeaadonbchdd/ldpkpkgnnacjhjfkagclpmibpplpmmlf/g' resources/app/out/vs/platform/browserOnboarding/static/browserOnboarding.html
      - cp -r . /app/lib/antigravity/
      - cp com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - |
        cat << 'EOF' > /app/bin/git
        #!/bin/sh
        if [ -S "$XDG_RUNTIME_DIR/gnupg/S.gpg-agent.ssh" ]; then
            export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/gnupg/S.gpg-agent.ssh"
        fi
        # Use a function-aware wrapper to support host-defined functions and aliases
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec git "$@"' bash "$@"
        EOF
        chmod +x /app/bin/git
      - |
        cat << 'EOF' > /app/bin/chromium
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec chromium "$@"' bash "$@"
        EOF
        chmod +x /app/bin/chromium
      - |
        cat << 'EOF' > /app/bin/node
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec node "$@"' bash "$@"
        EOF
        chmod +x /app/bin/node
      - |
        cat << 'EOF' > /app/bin/npx
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec npx "$@"' bash "$@"
        EOF
        chmod +x /app/bin/npx
      - |
        cat << 'EOF' > /app/bin/pnpm
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec pnpm "$@"' bash "$@"
        EOF
        chmod +x /app/bin/pnpm
      - |
        cat << 'EOF' > /app/bin/pnpx
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec pnpx "$@"' bash "$@"
        EOF
        chmod +x /app/bin/pnpx
      - |
        cat << 'EOF' > /app/bin/wmill
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec wmill "$@"' bash "$@"
        EOF
        chmod +x /app/bin/wmill
      - |
        cat << 'EOF' > /app/bin/host-spawn
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec "$@"' bash "$@"
        EOF
        chmod +x /app/bin/host-spawn
      - |
        cat << 'EOF' > /app/bin/docker
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec docker "$@"' bash "$@"
        EOF
        chmod +x /app/bin/docker
      - |
        cat << 'EOF' > /app/bin/docker-compose
        #!/bin/sh
        exec flatpak-spawn --host bash -l -c '[ -f ~/.bashrc ] && . ~/.bashrc; exec docker-compose "$@"' bash "$@"
        EOF
        chmod +x /app/bin/docker-compose
      - "cat << 'EOF' > /app/bin/antigravity\n#!/bin/sh\n# Auto-Detection for Guix System\n# If /gnu/store exists, we apply specialized environment fixes for performance and compatibility.\nif [ -d \"/gnu/store\" ]; then\n    # DBus Fix: Point directly to the host's user-bus socket.\n    # This bypasses the broken symlink logic in the Flatpak runtime on Guix.\n    HOST_UID=$(stat -c '%u' \"$HOME\")\n    export DBUS_SESSION_BUS_ADDRESS=\"unix:path=/run/user/$HOST_UID/bus\"\n    \n    # PATH Fix: Include Guix profile bins so LSP and build tools work natively.\n    export PATH=\"$PATH:$HOME/.config/guix/current/bin:$HOME/.guix-profile/bin\"\n    \n    # Guile Load Path Fix: Required for Scheme LSP support when editing Guix configs.\n    export GUILE_LOAD_PATH=\"$HOME/.config/guix/current/share/guile/site/3.0:$HOME/.guix-profile/share/guile/site/3.0:/run/current-system/profile/share/guile/site/3.0:$GUILE_LOAD_PATH\"\n    export GUILE_LOAD_COMPILED_PATH=\"$HOME/.config/guix/current/lib/guile/3.0/site-ccache:$HOME/.guix-profile/lib/guile/3.0/site-ccache:/run/current-system/profile/lib/guile/3.0/site-ccache:$GUILE_LOAD_COMPILED_PATH\"\n    \n    # Graphics Fix: Point to the host's specialized graphics driver paths.\n    export GBM_BACKENDS_PATH=\"/run/current-system/profile/lib/gbm\"\n    export __EGL_VENDOR_LIBRARY_DIRS=\"/run/current-system/profile/share/glvnd/egl_vendor.d\"\nfi\n\n# Launch binary with no-sandbox to allow AI agents to manage processes correctly.\nexec /app/lib/antigravity/antigravity --no-sandbox --disable-setuid-sandbox \"$@\"\nEOF\n"
      - chmod +x /app/bin/antigravity /app/lib/antigravity/antigravity
      - |
        cat << 'EOF' > /app/share/applications/com.google.Antigravity.desktop
        [Desktop Entry]
        Name=Google Antigravity
        Comment=Google Antigravity Desktop Application
        Exec=antigravity %u
        Icon=com.google.Antigravity
        Type=Application
        Categories=Development;TextEditor;
        MimeType=x-scheme-handler/antigravity;
        StartupWMClass=antigravity
        EOF
      - cp resources/app/out/vs/platform/browserOnboarding/static/antigravity.svg /app/share/icons/hicolor/scalable/apps/com.google.Antigravity.svg
    sources:
      - type: archive
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.21.6-5723021441368064/linux-x64/Antigravity.tar.gz
        sha256: 36fb3b270067c9654c0157a8f8b1ccf5986579f7f2f8e367cfb1616515f9eb14
        strip-components: 1
      - type: file
        path: com.google.Antigravity.metainfo.xml
