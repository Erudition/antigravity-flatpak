id: com.google.Antigravity
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: antigravity
branch: latest
finish-args:
  # Basic network and IPC access for the IDE and its agent
  - --share=network
  - --share=ipc
  # Standard display sockets for X11 and Wayland
  - --socket=x11
  - --socket=wayland
  # Bypass Flatpak's default session-bus symlink logic which is broken on non-systemd hosts (Guix/Alpine).
  # We handle the bus connection manually in the startup script.
  - --nosocket=session-bus
  # Required for hardware/power status discovery and some system-level integrations
  - --socket=system-bus
  # Essential for PipeWire/PulseAudio support to prevent wireplumber CPU spikes
  - --socket=pulseaudio
  # Required for full GPU acceleration, particularly for NVIDIA
  - --device=all
  # Access to user files, since this is an IDE
  - --filesystem=home
  # Allow the agent to interact with the host's Docker daemon
  - --filesystem=/var/run/docker.sock
  # Desktop integration for secrets management and GPG signing
  - --filesystem=xdg-run/keyring
  - --filesystem=xdg-run/gnupg
  # Permission to send desktop alerts
  - --talk-name=org.freedesktop.Notifications
  # Permission to access the secrets portal
  - --talk-name=org.freedesktop.secrets
  # Access to the desktop portals for file selection, etc.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.freedesktop.portal.Flatpak
  - --talk-name=org.freedesktop.Flatpak
  # Force GNOME branding for consistent UI behavior
  - --env=XDG_CURRENT_DESKTOP=GNOME
  # Standard SSL certificate locations for the agent to fetch external data
  - --env=SSL_CERT_DIR=/etc/ssl/certs
  - --env=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
  ## Guix-specific mounts (Optional/Ignored on standard distros)
  # Essential: All Guix tools and libraries reside here.
  - --filesystem=/gnu/store:ro
  # Essential: Profile management and state. Must be read-write for 'guix shell'.
  - --filesystem=/var/guix
  # Essential: Host system profile (for graphics drivers and system-wide modules).
  - --filesystem=/run/current-system:ro
  # Essential: Explicitly mount profiles to ensure symlinks resolve correctly inside the sandbox.
  - --filesystem=~/.guix-profile:ro
  - --filesystem=~/.config/guix:ro
  # Essential: Allow 'herd' and 'shepherd' commands to talk to the existing host process.
  - --filesystem=xdg-run/shepherd:ro
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/antigravity /app/bin /app/share/applications /app/share/icons/hicolor/scalable/apps /app/share/metainfo
      - perl -pi -e 's/eeijfnjmjelapkebgockoeaadonbchdd/ldpkpkgnnacjhjfkagclpmibpplpmmlf/g' resources/bin/language_server
      - cp -r . /app/lib/antigravity/
      - cp com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - cp host-bash /app/bin/host-bash
      - cp antigravity-host-exec /app/bin/antigravity-host-exec
      - cp antigravity-wrapper /app/bin/antigravity
      - chmod +x /app/bin/host-bash /app/bin/antigravity-host-exec /app/bin/antigravity
      - chmod +x /app/lib/antigravity/antigravity || chmod +x /app/lib/antigravity/antigravity-ide
      - ln -sf antigravity-host-exec /app/bin/git
      - ln -sf antigravity-host-exec /app/bin/chromium
      - ln -sf antigravity-host-exec /app/bin/node
      - ln -sf antigravity-host-exec /app/bin/npx
      - ln -sf antigravity-host-exec /app/bin/pnpm
      - ln -sf antigravity-host-exec /app/bin/pnpx
      - ln -sf antigravity-host-exec /app/bin/wmill
      - ln -sf antigravity-host-exec /app/bin/docker
      - ln -sf antigravity-host-exec /app/bin/docker-compose
      - |
        cat << 'EOF' > /app/share/applications/com.google.Antigravity.desktop
        [Desktop Entry]
        Name=Google Antigravity
        Comment=Google Antigravity Desktop Application
        Exec=antigravity %u
        Icon=com.google.Antigravity
        Type=Application
        Categories=Development;TextEditor;
        MimeType=x-scheme-handler/antigravity;
        StartupWMClass=antigravity
        EOF
      - cp com.google.Antigravity.svg /app/share/icons/hicolor/scalable/apps/com.google.Antigravity.svg
    sources:
      - type: archive
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.0.6-5413878570549248/linux-x64/Antigravity.tar.gz
        sha256: ad1e04535149b07c27030eb1ead40f4efda388cb39020bcbb9accdfb49e44cc5
        strip-components: 1
      - type: file
        path: com.google.Antigravity.metainfo.xml
      - type: file
        path: antigravity-wrapper
      - type: file
        path: host-bash
      - type: file
        path: antigravity-host-exec
      - type: file
        path: assets/com.google.Antigravity.svg
  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -D host-spawn-x86_64 /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
